# the safe template (goes to GitHub)
# config.example.yaml
# This is a TEMPLATE with fake values. Safe to put on GitHub.
# To use: copy this file to "config.yaml" and fill in your real values.
# config.yaml is git-ignored and never uploaded.

# Network drive mount paths (where they appear in /mnt or /media)
netdrive_paths:
  - "/mnt/YourDrive1"
  - "/mnt/YourDrive2"

# Your organization's VPN download URL
vpn_url: "https://vpn.example.com/download/"

citrix_url: "https://www.citrix.com/downloads/workspace-app/linux/"

# Brother PT-P950NW label printer IP address (must be on the same subnet)
printer_ip: "PRINTER_IP_HERE"

# ESP32 power-on helper (optional). If the printer doesn't answer, linuxfixit
# asks this ESP32 to press the printer's power button once.
# Leave both empty to turn the feature off.
esp32_ip: ""          # e.g. "10.61.0.60" (use a DHCP reservation)
esp32_token: ""       # same text as TOKEN in b2_press_api.ino. Never commit the real one.

# FollowMe printing (card: "Set up the FollowMe printer"). All optional:
# they only pre-fill the questions. Real host names go in the real config.yaml.
followme_server: "print.example.com"
followme_queue: "FollowMe-Queue-Name"        # queue name ON the print server
followme_local_name: "FollowMe-MFP-PCL"      # queue name on this PC
followme_domain: "WIN"                       # Windows domain added before the username
# followme_ppd: "/path/to/KOC751iUX.ppd"     # only if no Konica PPD is on the PC yet
