# Fix Helper catalog - v0
# type: script | manual      privilege: none | root
format_version: 1

fixes:

  # ===== 3 v0 PRIORITIES =====

  # 1. Quicker domain login (needs root -> pkexec password popup)
  - id: sssd-slow-login
    title: "Domain login takes very long"
    description: >
      Speeds up domain user login by skipping slow AD group checks.
      An administrator password will be requested.
    category: "Domain / Login"
    type: script
    privilege: root
    script: fix-sssd-login.sh

  # 2a. Install all M365 web app icons (global, needs root)
  - id: m365-webapps-install
    title: "Add web shortcuts for Microsoft 365 (Outlook, Word, Excel, PowerPoint, Teams)"
    description: >
      Adds desktop shortcuts that open the online (browser) versions of these
      Microsoft 365 apps in their own window. Installs Chromium if it's missing.
      Available to everyone on this machine; an administrator password is requested.
    category: "Office applications"
    type: script
    privilege: root
    script: install-m365-webapps.sh

  # 2b. Install Outlook icon only (global, needs root)
  - id: outlook-webapp-install
    title: "Add a web shortcut for Outlook"
    description: >
      Adds one desktop shortcut that opens Outlook on the web (Outlook Online)
      in its own window. Available to everyone on this machine; an
      administrator password is requested.
    category: "Office applications"
    type: script
    privilege: root
    script: install-outlook-webapp.sh

  # 2c. Remove the M365 icons (global, needs root)
  - id: m365-webapps-uninstall
    title: "Remove the Microsoft 365 web shortcuts"
    description: >
      Removes the Microsoft 365 web shortcuts created above from this machine.
      An administrator password is requested.
    category: "Office applications"
    type: script
    privilege: root
    script: uninstall-m365-webapps.sh

  # ===== Wifi  =====
  - id: fix-dtusecure-wifi
    title: "Auto-connect to DTUsecure (stop the KDE Wallet prompt)"
    description: >
      Stores your DTUsecure password system-wide so the laptop connects
      automatically at startup, instead of falling back to DTUguest and
      asking for the KDE Wallet password.
    category: "Network"
    type: script
    privilege: none
    script: fix-dtusecure-wifi.sh

  # ===== PRINTERS =====
  # Print a label directly to the Brother PT-P950NW network label printer.
  # No Brother driver/SDK/serial number needed -- only the printer IP and a
  # network path to it (same subnet). The script runs a preflight check
  # (ping + LPR port 515), then pops up a form for text/width/copies/bold.
  - id: print-label
    title: "Print a label (Brother PT-P950NW)"
    description: >
      Print a text label on the Brother PT-P950NW. The computer must be on the
      same network (subnet) as the printer. A short check runs first; if it
      passes, you can set the text, tape width, number of copies, and bold.
    category: "Printers"
    type: script
    privilege: none
    script: print-label.sh
    button_label: "Print label"

  # Set up (or move) the FollowMe copier queue. Two halves:
  #   setup-followme-printer.sh       runs as the user: asks destination, which old
  #                                   queues to remove, and the DTU login (zenity)
  #   setup-followme-printer-root.sh  started by the first via pkexec: tests the login,
  #                                   writes print-sustain.creds, installs the
  #                                   smbspool-auth courier, creates the queue.
  # privilege is "none" on purpose: pop-ups cannot open from a pkexec (root) script,
  # so the user half asks the questions and calls pkexec itself.
  - id: followme-printer-setup
    title: "Set up the FollowMe printer (new print server or queue)"
    description: >
      Connects this PC to a FollowMe print server: asks for the server and queue
      name, removes old FollowMe queues you tick (plotters are never touched),
      and saves your DTU login so you are not asked for it on every print.
      An administrator password will be requested.
    category: "Printers"
    type: script
    privilege: none
    script: setup-followme-printer.sh
    button_label: "Set up printer"

  # ===== OFFICE / NETWORK DRIVES =====
  # Clear stalled P & Q network drives
  - id: clear-network-drives
    title: "Clear stalled network drives (P and Q)"
    description: >
      If your P and Q drives show a red X even after running the mount script,
      this clears the stale connection so you can try again from a clean state.
      An administrator password will be requested.
    category: "Network drives"
    type: script
    privilege: root
    script: clear-network-drives.sh

  # OnlyOffice access to network drives (user-level, NO password)
  - id: onlyoffice-netdrives
    title: "OnlyOffice cannot access network drives"
    description: >
      Grants OnlyOffice access to your network drives. Runs as you, no admin password needed.
    category: "Office applications"
    type: script
    privilege: none
    script: onlyoffice-qdrev.sh


  # ===== OPTIONAL SOFTWARE =====

  # Cisco VPN - interactive installer, so manual steps
  - id: dtu-vpn-install
    title: "Install Cisco VPN (DTU)"
    description: >
      The VPN installer is interactive (asks you to accept a licence),
      so follow these steps in a terminal.
    category: "Optional software"
    type: manual
    image_prefix: vpn  
    steps:
      - "Open your organization's VPN download page: {vpn_url} (download the Linux/64 package into Downloads)."
      - "In **Downloads**, extract the downloaded archive (right click -> Extract -> Extract archive here)."
      - "Open the extracted folders until you reach the folder named 'vpn' that contains vpn_install.sh. (/home/your-username/Downloads/cisco-secure-client-linux64-5.1.3.62/nvm/)"
      - "Right click on blank space inside the 'vpn' folder and choose 'Open Terminal Here'."
      - "Run: sudo ./vpn_install.sh  (an administrator must type their password)."
      - "When asked to accept the licence terms, type y and press Enter."
      - "Open Cisco Secure Client and connect to: vpn.dtu.dk"
      - "Approve the sign-in in Microsoft Authenticator on your phone."

  # Citrix Workspace - public download page + interactive installer, so manual steps
  - id: citrix-install
    title: "Install Citrix Workspace"
    description: >
      Download Citrix from the web, then click "Fix it" to finish.
    category: "Optional software"
    type: manual
    action_script: citrix-install.sh
    action_label: "Finish installing Citrix"
    action_privilege: root
    steps:
      - "Open the Citrix Workspace download page: {citrix_url}"
      - "Under 'Workspace app for Linux', download the Debian package (.deb) for 64-bit into your Downloads folder."
      - "Come back here and click 'Fix it' below."


