name: Release APT repo

# Publishes a signed APT repository to GitHub Pages whenever you push a
# version tag (e.g. `git tag v0.1.7 && git push origin v0.1.7`).
#
# One-time setup before this works:
#  1. Generate a signing key on your machine:
#        gpg --quick-generate-key "LinuxFixIt <it@example.com>" default default never
#        gpg --armor --export-secret-keys "LinuxFixIt <it@example.com>" > private.asc
#  2. In GitHub repo Settings -> Secrets and variables -> Actions, add:
#        GPG_PRIVATE_KEY = contents of private.asc
#        GPG_PASSPHRASE  = the key passphrase (leave empty if none)
#     Then delete private.asc locally (keep one offline backup).
#  3. In Settings -> Pages, set "Source" = GitHub Actions.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (full history for git-tag versioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Build .deb
        run: ./packaging/build.sh

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          echo "GPG_KEY_ID=$KEYID" >> "$GITHUB_ENV"

      - name: Build signed APT repository
        env:
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./packaging/make-apt-repo.sh

      - name: Include user setup script in the published repo
        run: cp packaging/setup-repo.sh public/setup-repo.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
